<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrera Docente — Estatuto de Profesionalización</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="app">
    <!-- Barra superior: se muestra durante el juego -->
    <header id="hud" class="oculto">
      <div class="hud-etapa" id="hud-etapa">Etapa</div>
      <div class="hud-fila">
        <span class="hud-etiqueta">Puntaje</span>
        <div class="barra">
          <div class="barra-relleno" id="barra-relleno"></div>
          <div class="barra-umbral" title="60%: mínimo exigido"></div>
        </div>
        <span class="hud-valor" id="hud-puntaje">50</span>
      </div>
      <div class="hud-fila hud-chips">
        <span class="chip" id="hud-grado">Sin escalafón</span>
        <span class="chip" id="hud-anio">Año 0</span>
      </div>
    </header>

    <!-- Aquí el motor dibuja cada pantalla -->
    <main id="pantalla"></main>
  </div>

  <script src="contenido.js"></script>
  <script src="motor.js"></script>
</body>
</html>
